<!DOCTYPE html>
{% load static %}
<!-- to load content from static folder  -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Page</title>
    {% include 'medi_app/common/common_css.html'  %}
<style>


.bg{
      background-image: url("{%static 'medi_app/images/fbg7.jpg'%}");
     }
 .feedback-div
{

display: flex;
margin-left:50px;
flex-wrap:wrap;
margin-top: 30px;


}
.feedback-card{

width:350px;
height: 300px;
margin:15px;
margin-left: 80px;
margin-bottom: 40px;
/* border: 3px solid red; */
border-radius: 10px;
transition: transform 0.5s; 
box-shadow:0 8px 16px rgb(0,0,0.8);
margin-bottom: 90px;
margin-top: 90px;


}
.feedback-card img{

width:40%;
height: 45%;
margin-top: -80px;
margin-left: 20px;
 border-radius: 10px;
 border:2px solid black;
 display: inline;
 margin-right: 10px;
}
  
.feedback-card:hover {
            transform: scale(1.1);
          /*   box-shadow: 0 8px 16px rgba(220, 7, 7, 0.8); */
             z-index: 10; /* Bring the hovered card to the front */
        }


    h6{

      font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;

       margin-left: 20px;



    }
    </style>
</head>
<body class="bg page-reviews">
 <div class="main-div">

    <!-- <h1 class="text-danger"> Medilocator Projects Welcomes You</h1> -->
    <!-- <img src="{% static 'medi_app/images/beautiful-view-sky-sunset-beach.jpg'  %}" style="width: 50%;height: 500px;" alt=""> -->
    <!-- here space  is mandatory after static word -->

    <!-- <div class="container-fluid  " style="background-color: beige; text-decoration: underline; text-align: center;">
    <h2 style="color: rgb(143, 159, 159); " > Medilocator Welcomes You</h2>

    </div>
 -->

    <!-- header code include here -->
  {% include 'medi_app/common/header.html' %}
  <div  style="margin: auto;" class="text-center">
    <h2 style="font-family: zico display inline;font-size:80px;color: black;">User Reviews</h2>
  </div>


  <!-- feedback div flex starts -->


  <div class="feedback-div" >
   {% for f in feedback_key %}
    <!-- loop for taking one by one review from feedback list or to take one object at a time from feedback key refer code in views.py -->

    <!-- div for small review boxes in flex box -->
    <div class="feedback-card">

      <img src="/media/{{f.user_pic}}" alt="">

      <h6>Rating:{{f.rating}}</h6>
      <h6>Reviews:{{f.query}}</h6>
      <h6>Posted by :{{f.name}}</h6>

    </div>


   {% endfor %}
  </div>
   <!-- feedback div flex ends -->
</div>   
   <!-- footer code included here -->
  {% include 'medi_app/common/footer.html' %}

  
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>  
  
</body>
</html>
