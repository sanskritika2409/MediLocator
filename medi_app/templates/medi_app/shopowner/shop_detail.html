<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shop_detail form</title>
    {% include 'medi_app/common/common_css.html'  %}
</head>
<style>
     .bg{
      background-image: url("{%static 'medi_app/images/fbg11.jpeg'%}");
      
     }
</style>
<body class="bg page-owner">
   
   <div class="main-div">
    <!-- header code include here -->
   {% include 'medi_app/shopowner/owner_header.html' %}
   {% if messages  %}

{% for m in messages   %}



<!-- <h1 style = "margin-top: 70px;">{{m}}</h1> -->
 <div class="alert alert-danger alert-dismissible fade show mx-auto text-center" role="alert" style="width: 50%; margin-top: 50px;">
  <strong>{{m}}</strong>
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

{% endfor %}


{% endif %}

    
<div class="w-50 text-center mx-auto mt-5">
    <h2 style="color: black; margin-top: 100px;">Shop Detail Form</h2>
</div>


<!-- div for form  code start-->
 <div class=" mx-auto " style="height: 660px;border-radius: 10px; width:26%; padding:10px;background-color: rgba(125, 119, 119, 0.304);">

   <form method="post" action="/shop_detail/" enctype="multipart/form-data">
    {% csrf_token  %}
      <div class="mb-3">
        <label for="shop_name" class="form-label "> <i class="fa-solid fa-envelope"></i>Enter Shopname</label>
        <input type="name" class="form-control" required placeholder="Enter your shopname" name="name">

    </div>

<div class="mb-3">
        <label for="gst_name" class="form-label ">
           <i class="fa-solid fa-hashtag"></i> Enter gst_number </label>
        <input type="number" class="form-control" required placeholder="Enter your gst number" name="number">

    </div>

    <div class="mb-3">
        <label for="description" class="form-label ">
         <span> <i class="fa-solid fa-comment"></i> description</span>   
        <textarea class="form-control"  cols="40" rows="4" placeholder="description" name="description" ></textarea>
    </div>


    <div class="mb-3">
        <label for="phone no." class="form-label ">
            <i class="fa-solid fa-phone"></i> Enter Phone number</label>
        <input type="number" class="form-control" required placeholder="Enter your phone no." name="phone">

    </div>

    <div class="mb-3">
        <label for="city" class="form-label">
        <i class="fa-solid fa-city"></i> Enter your city</label>
        <input type="name" class="form-control" required placeholder="Enter your city" name="city">

    </div>

    <div class="mb-3">
        <label for="address" class="form-label ">
           <i class="fa-solid fa-location-pin"></i> Enter your address</label>
        <input type="text" class="form-control" required placeholder="Enter your address" name="address">
        </div>
     <div class="text-center">
        <button class="btn btn-success">Submit</button>

     </div>
  
</div>
    







  {% include 'medi_app/common/footer.html' %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>  

</body>
</html>
