<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Locations Map</title>
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  
  <style>
        #map { height: 540px; width: 100%; margin-bottom: 10px; }
        .search-container {
            position: static; transform: none; z-index: 1;
            display: flex; gap: .6rem; width: min(96%, 1200px); margin: 1rem auto 0; padding: .8rem;
            background: #fff; border: 1px solid #e3e7e2; border-radius: 14px; box-shadow: 0 10px 30px rgba(16,24,40,.12);
        }
        .search-container input { flex: 1; padding: .65rem .9rem; border: 1px solid #d5dbd5; border-radius: 10px; font-size: .95rem; }
        .search-container button { padding: .65rem 1.3rem; border: 0; border-radius: 10px; font-weight: 600; color: #fff; background: #0f5c4d; cursor: pointer; }
        .search-container button.reset { background: #fff; color: #0f5c4d; border: 1px solid #0f5c4d; }
        .map-note { width: min(96%, 1200px); margin: .6rem auto 0; color: #d3e3dc; font-size: .92rem; text-align: center; }
        .custom-marker i { font-size: 22px; color: #0f5c4d; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
    </style>
    {% include 'medi_app/common/common_css.html'%}
</head>
<body class="bg page-user">
    <div class="main-body">

    {%include 'medi_app/user/user_header.html'%}
    <h1 style="margin-top: 80px; color: #334464; font-family: cooper;">User Locations</h1>
    <div class="search-container">
        <input type="text" id="search" placeholder="Search a city or area to find shops within 5 km..." />
        <button id="search-button">Search</button>
        <button id="reset-button" class="reset" type="button">Show all</button>
    </div>
    <div class="map-note" id="map-note"></div>
    <div id="map">

    </div>
</div>
{%include 'medi_app/common/footer.html'%}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var circle = null;
        var map = L.map('map').setView([20.5937, 78.9629], 5);

        // OpenStreetMap tiles need a Referer header (Django's default policy removes it),
        // so we send the origin explicitly. If OSM still refuses, fall back to CARTO tiles automatically.
        var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            referrerPolicy: 'strict-origin-when-cross-origin',
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        var tileErrors = 0, usingFallback = false;
        osmLayer.on('tileerror', function () {
            tileErrors++;
            if (tileErrors >= 4 && !usingFallback) {
                usingFallback = true;
                map.removeLayer(osmLayer);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                    subdomains: 'abcd', maxZoom: 19,
                    attribution: '&copy; OpenStreetMap contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
                }).addTo(map);
            }
        });
        setTimeout(function () { map.invalidateSize(); }, 300);
        window.addEventListener('resize', function () { map.invalidateSize(); });

        function createCustomIcon(iconClass) {
            return L.divIcon({
                html: '<i class="' + iconClass + '"></i>',
                className: 'custom-marker',
                iconSize: [30, 42],
                iconAnchor: [15, 30],
                popupAnchor: [0, -28]
            });
        }

        // Shop data from Django (escaped so quotes / new lines cannot break the script)
        var shops = [
        {% for user in users %}
            { name: "{{ user.shop_name|escapejs }}", description: "{{ user.description|escapejs }}",
              lat: "{{ user.lat|escapejs }}", log: "{{ user.log|escapejs }}", icon: "{{ user.icon_class|escapejs }}" },
        {% endfor %}
        ];

        var userMarkers = [];
        shops.forEach(function (s) {
            var lat = parseFloat(s.lat), lng = parseFloat(s.log);
            if (isNaN(lat) || isNaN(lng)) { return; }          // skip shops without valid coordinates
            var marker = L.marker([lat, lng], { icon: createCustomIcon(s.icon || 'fas fa-home') });
            var html = '<strong></strong>';
            var el = document.createElement('div');
            var t = document.createElement('strong'); t.textContent = s.name; el.appendChild(t);
            if (s.description) { var d = document.createElement('div'); d.textContent = s.description; el.appendChild(d); }
            marker.bindPopup(el);
            marker.on('click', function () { speakText(s.description || s.name); });
            userMarkers.push({ name: s.name, description: s.description, lat: lat, log: lng, marker: marker });
        });

        function speakText(text) {
            if (!('speechSynthesis' in window) || !text) { return; }
            speechSynthesis.cancel();
            speechSynthesis.speak(new SpeechSynthesisUtterance(text));
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            var R = 6371;
            var dLat = (lat2 - lat1) * Math.PI / 180;
            var dLon = (lon2 - lon1) * Math.PI / 180;
            var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function note(msg) { document.getElementById('map-note').textContent = msg; }

        // Show every shop on first load
        function showAll() {
            if (circle) { map.removeLayer(circle); circle = null; }
            userMarkers.forEach(function (u) { u.marker.addTo(map); });
            if (userMarkers.length) {
                map.fitBounds(L.featureGroup(userMarkers.map(function (u) { return u.marker; })).getBounds().pad(0.3), { maxZoom: 14 });
                note(userMarkers.length + ' shop(s) on the map. Search a place to see shops within 5 km.');
            } else {
                note('No shops with a saved location yet.');
            }
        }
        showAll();

        function doSearch() {
            var query = document.getElementById('search').value.trim();
            if (!query) { showAll(); return; }
            fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query), { referrerPolicy: 'strict-origin-when-cross-origin' })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (!data.length) { alert('Location not found. Please try again.'); return; }
                    var sLat = parseFloat(data[0].lat), sLon = parseFloat(data[0].lon);
                    map.setView([sLat, sLon], 12);
                    if (circle) { map.removeLayer(circle); }
                    circle = L.circle([sLat, sLon], { color: '#0f5c4d', fillColor: '#0f5c4d', fillOpacity: 0.15, radius: 5000 }).addTo(map);
                    var found = 0;
                    userMarkers.forEach(function (u) {
                        if (calculateDistance(sLat, sLon, u.lat, u.log) <= 5) { u.marker.addTo(map); found++; }
                        else { map.removeLayer(u.marker); }
                    });
                    note(found ? found + ' shop(s) within 5 km of "' + query + '".' : 'No shops within 5 km of "' + query + '". Try "Show all".');
                })
                .catch(function (e) { console.error('Error:', e); alert('Search failed. Check your internet connection.'); });
        }
        document.getElementById('search-button').addEventListener('click', doSearch);
        document.getElementById('search').addEventListener('keydown', function (e) { if (e.key === 'Enter') { doSearch(); } });
        document.getElementById('reset-button').addEventListener('click', function () { document.getElementById('search').value = ''; showAll(); });
    </script>
</body>
</html>
