<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    {% include 'medi_app/common/common_css.html'  %}
</head>
<style>   .bg{
      background-image: url("{%static 'medi_app/images/fbg13.jpeg'%}");
     }</style>
<body class="bg page-user">

{% if messages  %}

{% for m in messages   %}



<!-- <h1 style = "margin-top: 70px;">{{m}}</h1> -->
 <div class="alert alert-danger alert-dismissible fade show mx-auto text-center" role="alert" style="width: 50%; margin-top: 40px;">
  <strong>{{m}}</strong>
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

{% endfor %}


{% endif %}

     <div class="main-div">
            <!-- header code include here -->
  {% include 'medi_app/user/user_header.html' %}
 
  
 
<div class="w-50 text-center mx-auto mt-5">
    <h2 class="" style="font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; font-style: oblique; margin-top: 60px;">Medicine Request</h2>
</div>


<!-- div for form  code start-->
 <div class=" mx-auto  " style="height: 530px;border-radius: 10px; width:26%; padding:10px ;margin-top: 10px;background-color: rgba(125, 119, 119, 0.304);">

   <form action="/medicine_request/" method="post" > 
      {% csrf_token %}
  




      <div class="mb-3">
        <label for="email" class="form-label "> <i class="fa-solid fa-envelope"></i>Enter Email</label>
        <input type="email" class="form-control" required placeholder="Enter your email" name="email" required value="{{user_detail}}" readonly>

    </div>


    <div class="mb-3">
        <label for="name" class="form-label ">
            <i class="fa-brands fa-whatsapp">Enter whatsaap number </i></label>
        <input type="number" class="form-control" required placeholder="Enter your whatsaap no." name="number" >   

        
    </div>

        
     <div class=" mb-3">
     <label for="medicine_name" class="text-area  form-label" ><i class="fa-solid fa-capsules">medicine name</i></label>
     <input type="text" class="form-control" placeholder=" Enter medicine name" name="med-name" required>
     </div>
     <div class=" mb-3">
     <label for="doc_name" class="text-area  form-label" ><i class="fa-solid fa-user-doctor">doctor name</i></label>
     <input type="name" class="form-control" placeholder=" Enter doc name" name="doc-name" required>
     </div>
     <!-- <div class=" mb-3">
     <label for="medicine_status" class="text-area  form-label" ><i class="fa-solid fa-circle-check"> medicine status</i></label>
     <input type="text" class="form-control" placeholder=" Enter medicine status" name=" status" required>
     </div> -->
     <div class=" mb-3">
     <label for="user_message" class="text-area  form-label" ><i class="fa-solid fa-comment-dots"> user message</i></label>
     <input type="text" class="form-control" placeholder=" Enter your message" name="message" required>
     </div>

<div class="text-center">
    <button class ="btn btn-success">Submit</button>


</div>    




  </form>



 </div>





<!-- div for form  code end-->
    





</div>

  {% include 'medi_app/common/footer.html' %}

  
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>  

</body>
</html>
