<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    {% include 'medi_app/common/common_css.html'  %}
</head>
<style>   .bg{
      background-image: url("{%static 'medi_app/images/fbg17.jpeg'%}");
     }</style>
<body class="bg page-user">

{% if messages  %}

{% for m in messages   %}



<!-- <h1 style = "margin-top: 70px;">{{m}}</h1> -->
 <div class="alert alert-danger alert-dismissible fade show mx-auto text-center" role="alert" style="width: 50%; margin-top: 50px;">
  <strong>{{m}}</strong>
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

{% endfor %}


{% endif %}

     <div class="main-div">
            <!-- header code include here -->
  {% include 'medi_app/user/user_header.html' %}
 
  
 
<div class="w-50 text-center mx-auto mt-5">
    <h2 class=""  style="margin-top: 100px; font-weight: 2000 ;font-style: oblique;">User FeedBack Form</h2>
</div>


<!-- div for form  code start-->
 <div class=" mx-auto" style="height: 400px;border-radius: 10px; width:26%; padding:10px; background-color: rgba(125, 119, 119, 0.304);">

   <form action="/user_feedback/" method="post" > 
      {% csrf_token %}
     <input type="hidden" name ="pic_path" value="{{user_detail.pic_name}}">
     <!-- to show the pic path of the user we use text pic path to hide we use hidden -->




      <div class="mb-3">
        <label for="email" class="form-label "> <i class="fa-solid fa-envelope"></i>Enter Email</label>
        <input type="email" class="form-control" required placeholder="Enter your email" name="email" required value="{{user_detail.email}}" readonly>

    </div>


    <div class="mb-3">
        <label for="name" class="form-label ">
            <i class="fa-solid fa-users"></i>Enter Name </label>
        <input type="name" class="form-control" required placeholder="Enter your name" name="name"  required value="{{user_detail.name}}">   

        <!--  required value helps to show namwe on page and readonly for not changing the email -->
    </div>

        
     <div class=" mb-3">
     <label for="query" class="text-area  form-label" ><i class="fa-solid fa-clipboard-question"></i>Query</label>
     <input type="text" class="form-control" placeholder=" Enter Your remark" name="query" required>
     </div>
    <div class="mb-3">
     <label for="rating" class="form-label"><i class="fa-solid fa-star"></i>Rating</label>
     <select name="rating" id="rating" class="form-select" required>
        <option value="">Give rating</option>
        <option value="★★★★★">★★★★★ &nbsp;Excellent</option>
        <option value="★★★★☆">★★★★☆ &nbsp;Very good</option>
        <option value="★★★☆☆">★★★☆☆ &nbsp;Good</option>
        <option value="★★☆☆☆">★★☆☆☆ &nbsp;Fair</option>
        <option value="★☆☆☆☆">★☆☆☆☆ &nbsp;Poor</option>
    </select>
    </div>

<div class="text-center">
    <button class ="btn btn-success">Submit</button>


</div>    




  </form>



 </div>





<!-- div for form  code end-->
    





</div>

  {% include 'medi_app/common/footer.html' %}

  
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>  

</body>
</html>
